<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tumkur Real Estate 9:16 Video Reel Stage</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>
  <!-- Native 9:16 Broadcast Stage (Automated Reel Pipeline) -->
  <div id="app-container">
    <!-- Uncluttered Base Map Canvas -->
    <div id="map"></div>

    <!-- Top Broadcast 5-Segment Story Progress Track (Visible on Map & Video) -->
    <div class="reel-story-tracker" id="story-tracker">
      <div class="story-segment" id="story-seg-0"><div class="story-fill" id="story-fill-0"></div></div>
      <div class="story-segment" id="story-seg-1"><div class="story-fill" id="story-fill-1"></div></div>
      <div class="story-segment" id="story-seg-2"><div class="story-fill" id="story-fill-2"></div></div>
      <div class="story-segment" id="story-seg-3"><div class="story-fill" id="story-fill-3"></div></div>
      <div class="story-segment" id="story-seg-4"><div class="story-fill" id="story-fill-4"></div></div>
    </div>

    <!-- Top Broadcast Telemetry Badge -->
    <div class="reel-header-badge">
      <div class="rec-indicator">
        <span class="rec-dot"></span>
        <span class="rec-tag">TUMKUR REEL</span>
      </div>
      <div class="sequence-counter" id="sequence-counter">PROPERTY 1 OF 5</div>
    </div>

    <!-- 9:16 Full-Bleed Video Walkthrough Overlay -->
    <div class="reel-panel" id="reel-panel">
      <div class="reel-video-container">
        <!-- Actual Walkthrough Video Streamed from agent_project -->
        <video id="reel-video" class="reel-video" playsinline loop muted></video>

        <!-- Broadcast Lower-Third Overlay (Non-Interactive Motion Graphics) -->
        <div class="reel-bottom-overlay">
          <div class="reel-price-row">
            <div class="reel-rate-badge" id="reel-rate-badge">₹1,950 / SQ.FT</div>
            <div class="reel-start-price" id="reel-start-price">From ₹23.40 Lakhs (30x40)</div>
          </div>

          <h2 class="reel-title" id="reel-title">1. P.N.K TOWNSHIP</h2>

          <!-- Landmark & Location Context -->
          <div class="reel-landmark" id="reel-landmark">
            📍 500m from Vijayanagar Main Rd, Behind Prasanna Dental Clinic, Ashok Nagar
          </div>

          <!-- Adjacent Areas Context -->
          <div class="adjacent-areas-box">
            <span class="adjacent-label">Surrounding:</span>
            <span id="reel-adjacent-list">S.S. Puram • Maruthi Nagar • Sadashivanagar</span>
          </div>

          <!-- Highlight Tags -->
          <div class="reel-highlights" id="reel-highlights"></div>
        </div>
      </div>
    </div>

    <!-- Map Phase Teleprompter Caption Card -->
    <div class="tour-banner" id="tour-banner">
      <div class="tour-live-dot"></div>
      <span class="tour-text" id="tour-text">📍 SITE 1: P.N.K TOWNSHIP • Orienting Tumkur City (5s)</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.local.js" onerror="/* optional local secret */"></script>
  <script src="config.js"></script>
  <script src="properties.js"></script>
  <script src="app.js"></script>
</body>
</html>
